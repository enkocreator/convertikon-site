<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONVERTIKON — coming soon</title>
<meta name="description" content="CONVERTIKON is a desktop length converter for architects, designers and construction — millimetres, centimetres, metres, feet and inches, with real fractions. Coming to Mac and Windows.">
<meta property="og:title" content="CONVERTIKON — coming soon">
<meta property="og:description" content="A desktop converter for architects, designers and construction. Metric on one side, imperial on the other. Coming to Mac and Windows.">
<meta property="og:image" content="https://convertikon.app/assets/icon.png">
<meta property="og:url" content="https://convertikon.app/">
<meta name="theme-color" content="#DCD9D3">
<link rel="icon" href="./assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<style>
  /* Chakra Petch, the app's UI face, self-hosted (SIL OFL — licence in assets/fonts/OFL.txt). */
  @font-face { font-family: 'Chakra Petch'; font-weight: 500; font-style: normal; font-display: swap;
               src: url('./assets/fonts/ChakraPetch-Medium.ttf') format('truetype'); }
  @font-face { font-family: 'Chakra Petch'; font-weight: 600; font-style: normal; font-display: swap;
               src: url('./assets/fonts/ChakraPetch-SemiBold.ttf') format('truetype'); }
  @font-face { font-family: 'Chakra Petch'; font-weight: 700; font-style: normal; font-display: swap;
               src: url('./assets/fonts/ChakraPetch-Bold.ttf') format('truetype'); }

  /* The app's own palette. The ground is the field-well grey; text in the value colour.
     --chrome is the app's own on-asphalt tone (footer icons, inactive mode word) — the
     one colour in the palette already proven to read on this texture. */
  :root {
    --ground: #DCD9D3;
    --ink:    #2E2B27;
    --gold:   #E8C32B;
    --dark:   #2E2B27;
    --chrome: #C6C2BA;
    /* The app-shape panel below: bigger than the real app (330 wide), capped so it
       never crowds a phone screen. */
    --panel-w: clamp(280px, 85vw, 400px);
  }

  * { box-sizing: border-box; }
  html { background: var(--ground); }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
    font-weight: 500;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .wrap {
    width: 100%;
    max-width: 760px;
    padding: 8vh 24px 32px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* A small copy of the real app panel: same asphalt texture, same 28px-style corner
     cuts and same title-bar padding as the app (18 sides, 28 top — see CLAUDE.md),
     scaled up from the app's 330px reference via --panel-w. That padding is also why
     the wordmark and the copy below it share one width: 330 - 2*18 = 294, exactly the
     wordmark's own width, so anything else set to 100% of this content box lines up
     with it automatically. No fields, no footer — just the shape, the mark and the copy. */
  .app-shape {
    position: relative;
    width: var(--panel-w);
    min-height: calc(var(--panel-w) / 330 * 455);
    padding: calc(var(--panel-w) / 330 * 45.5) calc(var(--panel-w) / 330 * 18) calc(var(--panel-w) / 330 * 36);
    background-color: #8A8A88;
    background-image: url('./assets/backdrop-asphalt.png');
    background-position: top left;
    background-size: var(--panel-w) auto;
    background-repeat: no-repeat;
    clip-path: polygon(
      calc(var(--panel-w) / 330 * 28) 0,
      100% 0,
      100% calc(100% - (var(--panel-w) / 330 * 28)),
      calc(100% - (var(--panel-w) / 330 * 28)) 100%,
      0 100%,
      0 calc(var(--panel-w) / 330 * 28)
    );
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    flex: none;
    /* the wordmark's own width — everything measured against it below */
    --wm-w: calc(var(--panel-w) / 330 * 294);
  }
  .app-shape .wordmark { display: block; width: var(--wm-w); height: auto; }

  /* Two lines, sized so the longer one ("on its way to end your") is exactly as
     wide as the wordmark: Chakra Petch Bold measures 1059.11px for it at 100px,
     i.e. 10.5911px per 1px of font-size. Scales with --panel-w since --wm-w does. */
  .panel-tagline {
    color: var(--chrome);
    font-weight: 700;
    font-size: calc(var(--wm-w) / 10.5911);
    line-height: 1.1;
    width: 100%;
    white-space: nowrap;
    text-align: justify;
    text-align-last: justify;  /* the shorter second line spreads to the same width */
    margin: 18px 0 0;
  }

  /* The largest size at which this text wraps onto five lines inside the wordmark's
     width (measured: 22.1px at 356px, i.e. 16.12 per px of font-size; 16.3 leaves a
     hair of safety). Every line is justified, so all five span that width. */
  .panel-sub {
    color: var(--chrome);
    opacity: 0.85;
    font-weight: 500;
    width: 100%;
    font-size: calc(var(--wm-w) / 16.3);
    line-height: 1.35;
    text-align: justify;
    text-align-last: justify;
    margin: auto 0 0;          /* rides down to the bottom, wordmark and tagline stay at the top */
  }

  .mascot {
    display: block;
    width: clamp(110px, 18vw, 150px);
    height: auto;
    margin: 56px 0 0;
  }

  .capture { margin-top: 32px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 52px;
    padding: 0 28px;
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--dark);
    background: var(--gold);
    border: 2px solid var(--gold);
    border-radius: 0;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { background: #F0CE3F; border-color: #F0CE3F; }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .note {
    margin: 14px 0 0;
    font-size: 13px;
    opacity: 0.8;
  }

  footer {
    margin-top: auto;
    padding-top: 72px;
    font-size: 13px;
    opacity: 0.8;
  }

  @media (max-width: 480px) {
    .wrap { padding: 6vh 16px 24px; }
    .btn { width: 100%; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .btn { transition: background-color .15s, border-color .15s; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="app-shape">
    <img class="wordmark" src="./assets/wordmark.svg" alt="CONVERTIKON" width="1793" height="240">
    <h1 class="panel-tagline">on its way to end your<br>metric–imperial pain</h1>
    <p class="panel-sub">A desktop converter for architects, designers and construction.
      Millimetres to feet and inches and back, with real fractions.
      Coming to Mac and Windows.</p>
  </div>

  <img class="mascot" src="./assets/icon.png" alt="" width="512" height="512">

  <!-- Email capture. Until the Kit form exists this is a plain mail link (README explains the swap). -->
  <div class="capture">
    <a class="btn" href="mailto:enkokokoko@gmail.com?subject=Tell%20me%20when%20CONVERTIKON%20launches&amp;body=Please%20let%20me%20know%20when%20CONVERTIKON%20is%20out.">Tell me when it launches</a>
    <p class="note">One email on launch day. Nothing else, ever.</p>
  </div>

  <footer>© 2026 Elizabeth Enko</footer>

</div>
</body>
</html>
