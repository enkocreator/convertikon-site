<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONVERTIKON — coming soon</title>
<meta name="description" content="CONVERTIKON is a desktop length converter for architects, designers and construction — millimetres, centimetres, metres, feet and inches, with real fractions. Coming to Mac and Windows.">
<meta property="og:title" content="CONVERTIKON — coming soon">
<meta property="og:description" content="A desktop converter for architects, designers and construction. Metric on one side, imperial on the other. Coming to Mac and Windows.">
<meta property="og:image" content="https://convertikon.app/assets/icon.png">
<meta property="og:url" content="https://convertikon.app/">
<meta name="theme-color" content="#6B665E">
<link rel="icon" href="./assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<style>
  /* Chakra Petch, the app's UI face, self-hosted (SIL OFL — licence in assets/fonts/OFL.txt). */
  @font-face { font-family: 'Chakra Petch'; font-weight: 500; font-style: normal; font-display: swap;
               src: url('./assets/fonts/ChakraPetch-Medium.ttf') format('truetype'); }
  @font-face { font-family: 'Chakra Petch'; font-weight: 600; font-style: normal; font-display: swap;
               src: url('./assets/fonts/ChakraPetch-SemiBold.ttf') format('truetype'); }
  @font-face { font-family: 'Chakra Petch'; font-weight: 700; font-style: normal; font-display: swap;
               src: url('./assets/fonts/ChakraPetch-Bold.ttf') format('truetype'); }

  /* The app's own palette. The ground is its label grey — the lightest tone in the
     palette on which the gold wordmark still reads (3.3:1). */
  :root {
    --ground: #6B665E;
    --ink:    #DCD9D3;
    --gold:   #E8C32B;
    --dark:   #2E2B27;
  }

  * { box-sizing: border-box; }
  html { background: var(--ground); }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
    font-weight: 500;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .wrap {
    width: 100%;
    max-width: 760px;
    padding: 12vh 24px 32px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .wordmark {
    display: block;
    width: min(88vw, 620px);
    height: auto;
  }

  .tagline {
    font-weight: 700;
    font-size: clamp(22px, 3.6vw, 32px);
    line-height: 1.2;
    letter-spacing: 0.5px;
    margin: 36px 0 0;
    max-width: 24ch;
    text-wrap: balance;
  }

  .sub {
    font-size: clamp(15px, 2vw, 18px);
    margin: 18px 0 0;
    max-width: 46ch;
    text-wrap: balance;
  }
  .sub b { font-weight: 600; }

  .mascot {
    display: block;
    width: clamp(110px, 18vw, 150px);
    height: auto;
    margin: 56px 0 0;
  }

  .capture { margin-top: 32px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 52px;
    padding: 0 28px;
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--dark);
    background: var(--gold);
    border: 2px solid var(--gold);
    border-radius: 0;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { background: #F0CE3F; border-color: #F0CE3F; }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .note {
    margin: 14px 0 0;
    font-size: 13px;
    opacity: 0.8;
  }

  footer {
    margin-top: auto;
    padding-top: 72px;
    font-size: 13px;
    opacity: 0.8;
  }

  @media (max-width: 480px) {
    .wrap { padding: 9vh 16px 24px; }
    .btn { width: 100%; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .btn { transition: background-color .15s, border-color .15s; }
  }
</style>
</head>
<body>
<div class="wrap">

  <img class="wordmark" src="./assets/wordmark.svg" alt="CONVERTIKON" width="1793" height="240">

  <h1 class="tagline">On its way to end your metric–imperial pain.</h1>

  <p class="sub">A desktop converter for <b>architects, designers and construction</b>.
    Millimetres to feet and inches and back, with real fractions.
    Coming to <b>Mac</b> and <b>Windows</b>.</p>

  <img class="mascot" src="./assets/icon.png" alt="" width="512" height="512">

  <!-- Email capture. Until the Kit form exists this is a plain mail link (README explains the swap). -->
  <div class="capture">
    <a class="btn" href="mailto:enkokokoko@gmail.com?subject=Tell%20me%20when%20CONVERTIKON%20launches&amp;body=Please%20let%20me%20know%20when%20CONVERTIKON%20is%20out.">Tell me when it launches</a>
    <p class="note">One email on launch day. Nothing else, ever.</p>
  </div>

  <footer>© 2026 Elizabeth Enko</footer>

</div>
</body>
</html>
