<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONVERTIKON — coming soon</title>
<meta name="description" content="CONVERTIKON is a desktop length converter for architects, designers and construction — millimetres, centimetres, metres, feet and inches, with real fractions. Coming to Mac and Windows.">
<meta property="og:title" content="CONVERTIKON — coming soon">
<meta property="og:description" content="A desktop converter for architects, designers and construction. Metric on one side, imperial on the other. Coming to Mac and Windows.">
<meta property="og:image" content="https://convertikon.app/assets/icon.png">
<meta property="og:url" content="https://convertikon.app/">
<meta name="theme-color" content="#DCD9D3">
<link rel="icon" href="./assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<style>
  /* Chakra Petch, the app's UI face, self-hosted (SIL OFL — licence in assets/fonts/OFL.txt). */
  @font-face { font-family: 'Chakra Petch'; font-weight: 500; font-style: normal; font-display: swap;
               src: url('./assets/fonts/ChakraPetch-Medium.ttf') format('truetype'); }
  @font-face { font-family: 'Chakra Petch'; font-weight: 700; font-style: normal; font-display: swap;
               src: url('./assets/fonts/ChakraPetch-Bold.ttf') format('truetype'); }

  /* Layout follows convertikon-site-design/convertikon-coming-soon.pdf (a 1280 x 1100
     frame). Everything in and under the panel is measured in the app's own units: the
     panel is 330 u wide, like the real app, and 1 u = --panel-w / 330. At the design's
     full size the panel is 425.5 px, and on smaller screens the whole block scales down. */
  :root {
    --ground: #DCD9D3;
    --ink:    #2E2B27;
    --gold:   #E8C32B;
    --panel-w: clamp(280px, calc(100vw - 32px), 425.5px);
    --u: calc(var(--panel-w) / 330);
  }

  * { box-sizing: border-box; }
  html { background: var(--ground); }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
    font-weight: 500;
    line-height: 1.5;
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .wrap {
    width: 100%;
    padding: 13.95vh 16px 32px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* The app panel: asphalt texture, the app's 28 u corner cuts, 330 x 455 u. */
  .app-shape {
    width: var(--panel-w);
    height: calc(var(--u) * 455);
    padding: calc(var(--u) * 49.64) calc(var(--u) * 18) 0;
    background: #8A8A88 url('./assets/backdrop-asphalt.png') top left / var(--panel-w) auto no-repeat;
    clip-path: polygon(
      calc(var(--u) * 28) 0, 100% 0,
      100% calc(100% - var(--u) * 28), calc(100% - var(--u) * 28) 100%,
      0 100%, 0 calc(var(--u) * 28)
    );
    color: var(--ground);
    flex: none;
  }
  .wordmark { display: block; width: calc(var(--u) * 294); height: auto; }

  /* The first line is a hair wider than the wordmark, so the box reaches past it on
     both sides (negative side margins) to keep both lines truly centred. Word spacing
     matches the design's tighter spaces. */
  .tagline {
    margin: calc(var(--u) * 9.5) calc(var(--u) * -12) 0;
    font-weight: 700;
    font-size: calc(var(--u) * 28.696);
    line-height: 1.189;
    word-spacing: calc(var(--u) * -1.63);
    white-space: nowrap;
    text-align: center;
  }

  /* Five justified lines and a centred last one, as set in the design. Each line is its
     own block so the breaks never move, whatever the screen size. */
  .copy {
    margin: calc(var(--u) * 62.4) calc(var(--u) * 2.5) 0 0;
    font-weight: 500;
    font-size: calc(var(--u) * 23.19);
    line-height: 1.204;
  }
  .copy span { display: block; white-space: nowrap; text-align: justify; text-align-last: justify; }
  .copy span:last-child { text-align: center; text-align-last: center; }

  /* Sign-up: one block the size of the gold button. Closed, it is the button; clicked,
     the same block becomes a dark email field (the app's value colour, gold focus) with
     a gold send square at its end. Enter sends, Esc closes it again. */
  .signup {
    position: relative;
    width: var(--panel-w);
    height: calc(var(--u) * 59.33);
    margin-top: calc(var(--u) * 28.3);
  }
  .signup .field-row { display: none; height: 100%; }
  .signup.open .btn { display: none; }
  .signup.open .field-row { display: flex; }
  .signup input[type="email"] {
    flex: 1;
    min-width: 0;
    height: 100%;
    padding: 0 calc(var(--u) * 18);
    font: inherit;
    font-weight: 500;
    font-size: calc(var(--u) * 16.6);
    color: var(--ground);
    caret-color: var(--gold);
    background: var(--ink);
    border: 2px solid var(--ink);
    border-right: 0;
    border-radius: 0;
    outline: none;
  }
  .signup input[type="email"]::placeholder { color: #9C978F; }
  .signup input[type="email"]:focus { border-color: var(--gold); }
  .signup .send {
    flex: none;
    width: calc(var(--u) * 59.33);
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    border-radius: 0;
    cursor: pointer;
    color: var(--ink);
    background: var(--gold);
  }
  .signup .send:hover { background: #F0CE3F; }
  .signup .send:disabled { cursor: default; opacity: .7; }
  .signup .send:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .signup .send svg { width: calc(var(--u) * 18); height: calc(var(--u) * 18); }
  .signup .trap { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .signup-msg {
    width: var(--panel-w);
    margin: calc(var(--u) * 10) 0 0;
    min-height: 1.5em;
    font-size: 14px;
  }
  .signup-done {
    width: var(--panel-w);
    margin-top: calc(var(--u) * 28.3);
    height: calc(var(--u) * 59.33);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: calc(var(--u) * 16.6);
    letter-spacing: calc(var(--u) * 1.49);
    text-transform: uppercase;
    color: var(--ink);
    background: var(--gold);
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: calc(var(--u) * 16.6);
    letter-spacing: calc(var(--u) * 1.49);
    text-transform: uppercase;
    color: var(--ink);
    background: var(--gold);
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { background: #F0CE3F; }
  .btn:disabled { cursor: default; opacity: .7; }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  footer {
    margin-top: auto;
    padding-top: 48px;
    font-size: 13px;
    opacity: 0.8;
  }

  /* The mascot stands in the bottom-right corner, feet on the page's bottom edge. */
  .mascot {
    position: absolute;
    right: clamp(16px, 4.25vw, 54.5px);
    bottom: 0;
    width: clamp(72px, 11.64vw, 149px);
    height: auto;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: no-preference) {
    .btn { transition: background-color .15s; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="app-shape">
    <img class="wordmark" src="./assets/wordmark.svg" alt="CONVERTIKON" width="1793" height="240">
    <h1 class="tagline">on its way to end your<br>metric–imperial pain</h1>
    <p class="copy">
      <span>A desktop converter for</span>
      <span>architects, designers and</span>
      <span>construction. Millimetres to</span>
      <span>feet and inches and back,</span>
      <span>with real fractions. Coming</span>
      <span>to Mac and Windows.</span>
    </p>
  </div>

  <!-- Email sign-up. Each address becomes a row in a private Google Sheet, through a
       small Apps Script web app (README explains the setup). -->
  <form class="signup" id="signup" novalidate>
    <button class="btn" type="button" id="signup-open" aria-expanded="false" aria-controls="email">Tell me when it launches</button>
    <div class="field-row">
      <label for="email" class="trap">Your email</label>
      <input type="email" id="email" name="email" placeholder="your@email.com" autocomplete="email" inputmode="email" required>
      <button class="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M4 12 L19 12 M13 6 L19 12 L13 18"/></svg>
      </button>
    </div>
    <input type="text" name="website" class="trap" tabindex="-1" autocomplete="off" aria-hidden="true">
  </form>
  <p class="signup-msg" id="signup-msg" role="status" aria-live="polite"></p>

  <footer>© 2026 Elizabeth Enko</footer>

</div>
<img class="mascot" src="./assets/mascot.png" alt="" width="448" height="448">
<script>
  // The Google Apps Script web-app URL that writes to the sign-up sheet. Until it is set,
  // sending falls back to opening an email, so nothing is ever lost.
  var SIGNUP_URL = '';

  (function () {
    var form = document.getElementById('signup');
    var opener = document.getElementById('signup-open');
    var field = document.getElementById('email');
    var send = form.querySelector('.send');
    var msg = document.getElementById('signup-msg');
    var valid = function (v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) && v.length <= 254; };

    function open() {
      form.classList.add('open');
      opener.setAttribute('aria-expanded', 'true');
      field.focus();
    }
    function close() {
      form.classList.remove('open');
      opener.setAttribute('aria-expanded', 'false');
      msg.textContent = '';
      opener.focus();
    }
    opener.addEventListener('click', open);
    field.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); }
    });
    // Clicking away from an empty field turns it back into the button.
    field.addEventListener('blur', function () {
      setTimeout(function () {
        if (!field.value.trim() && !form.contains(document.activeElement)) close();
      }, 150);
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = field.value.trim();
      if (!valid(email)) { msg.textContent = 'That doesn\u2019t look like an email address.'; field.focus(); return; }
      if (!SIGNUP_URL) {
        location.href = 'mailto:enkokokoko@gmail.com?subject=' + encodeURIComponent('Tell me when CONVERTIKON launches') +
                        '&body=' + encodeURIComponent('Please let me know when CONVERTIKON is out: ' + email);
        return;
      }
      send.disabled = true; msg.textContent = 'Sending\u2026';
      var body = new URLSearchParams({ email: email, website: form.website.value, source: location.hostname });
      // no-cors: Apps Script can't answer cross-origin, so the reply is opaque; a network
      // failure still rejects, which is the case worth telling the visitor about.
      fetch(SIGNUP_URL, { method: 'POST', mode: 'no-cors', body: body })
        .then(function () {
          var done = document.createElement('div');
          done.className = 'signup-done';
          done.textContent = 'You\u2019re on the list';
          form.replaceWith(done);
          msg.textContent = 'We\u2019ll email you once, on launch day.';
        })
        .catch(function () {
          send.disabled = false;
          msg.textContent = 'Couldn\u2019t send just now \u2014 please try again.';
        });
    });
  })();
</script>
</body>
</html>
