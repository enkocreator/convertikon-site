<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONVERTIKON — coming soon</title>
<meta name="description" content="CONVERTIKON is a desktop length converter for architects, designers and construction — millimetres, centimetres, metres, feet and inches, with real fractions. Coming to Mac and Windows.">
<meta property="og:title" content="CONVERTIKON — coming soon">
<meta property="og:description" content="A desktop converter for architects, designers and construction. Metric on one side, imperial on the other. Coming to Mac and Windows.">
<meta property="og:image" content="https://convertikon.app/assets/icon.png">
<meta property="og:url" content="https://convertikon.app/">
<meta name="theme-color" content="#DCD9D3">
<link rel="icon" href="./assets/icon.png" type="image/png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<style>
  /* Chakra Petch, the app's UI face, self-hosted (SIL OFL — licence in assets/fonts/OFL.txt). */
  @font-face { font-family: 'Chakra Petch'; font-weight: 500; font-style: normal; font-display: swap;
               src: url('./assets/fonts/ChakraPetch-Medium.ttf') format('truetype'); }
  @font-face { font-family: 'Chakra Petch'; font-weight: 700; font-style: normal; font-display: swap;
               src: url('./assets/fonts/ChakraPetch-Bold.ttf') format('truetype'); }

  /* Layout follows convertikon-site-design/convertikon-coming-soon.pdf (a 1280 x 1100
     frame). Everything in and under the panel is measured in the app's own units: the
     panel is 330 u wide, like the real app, and 1 u = --panel-w / 330. At the design's
     full size the panel is 425.5 px, and on smaller screens the whole block scales down. */
  :root {
    --ground: #DCD9D3;
    --ink:    #2E2B27;
    --gold:   #E8C32B;
    --panel-w: clamp(280px, calc(100vw - 32px), 425.5px);
    --u: calc(var(--panel-w) / 330);
  }

  * { box-sizing: border-box; }
  html { background: var(--ground); }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
    font-weight: 500;
    line-height: 1.5;
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .wrap {
    width: 100%;
    padding: 13.95vh 16px 32px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* The app panel: asphalt texture, the app's 28 u corner cuts, 330 x 455 u. */
  .app-shape {
    width: var(--panel-w);
    height: calc(var(--u) * 455);
    padding: calc(var(--u) * 49.64) calc(var(--u) * 18) 0;
    background: #8A8A88 url('./assets/backdrop-asphalt.png') top left / var(--panel-w) auto no-repeat;
    clip-path: polygon(
      calc(var(--u) * 28) 0, 100% 0,
      100% calc(100% - var(--u) * 28), calc(100% - var(--u) * 28) 100%,
      0 100%, 0 calc(var(--u) * 28)
    );
    color: var(--ground);
    flex: none;
  }
  .wordmark { display: block; width: calc(var(--u) * 294); height: auto; }

  /* The first line is a hair wider than the wordmark, so the box reaches past it on
     both sides (negative side margins) to keep both lines truly centred. Word spacing
     matches the design's tighter spaces. */
  .tagline {
    margin: calc(var(--u) * 9.5) calc(var(--u) * -12) 0;
    font-weight: 700;
    font-size: calc(var(--u) * 28.696);
    line-height: 1.189;
    word-spacing: calc(var(--u) * -1.63);
    white-space: nowrap;
    text-align: center;
  }

  /* Five justified lines and a centred last one, as set in the design. Each line is its
     own block so the breaks never move, whatever the screen size. */
  .copy {
    margin: calc(var(--u) * 62.4) calc(var(--u) * 2.5) 0 0;
    font-weight: 500;
    font-size: calc(var(--u) * 23.19);
    line-height: 1.204;
  }
  .copy span { display: block; white-space: nowrap; text-align: justify; text-align-last: justify; }
  .copy span:last-child { text-align: center; text-align-last: center; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--panel-w);
    height: calc(var(--u) * 59.33);
    margin-top: calc(var(--u) * 28.3);
    font-weight: 700;
    font-size: calc(var(--u) * 16.6);
    letter-spacing: calc(var(--u) * 1.49);
    text-transform: uppercase;
    color: var(--ink);
    background: var(--gold);
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { background: #F0CE3F; }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  footer {
    margin-top: auto;
    padding-top: 48px;
    font-size: 13px;
    opacity: 0.8;
  }

  /* The mascot stands in the bottom-right corner, feet on the page's bottom edge. */
  .mascot {
    position: absolute;
    right: clamp(16px, 4.25vw, 54.5px);
    bottom: 0;
    width: clamp(72px, 11.64vw, 149px);
    height: auto;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: no-preference) {
    .btn { transition: background-color .15s; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="app-shape">
    <img class="wordmark" src="./assets/wordmark.svg" alt="CONVERTIKON" width="1793" height="240">
    <h1 class="tagline">on its way to end your<br>metric–imperial pain</h1>
    <p class="copy">
      <span>A desktop converter for</span>
      <span>architects, designers and</span>
      <span>construction. Millimetres to</span>
      <span>feet and inches and back,</span>
      <span>with real fractions. Coming</span>
      <span>to Mac and Windows.</span>
    </p>
  </div>

  <!-- Email capture. Until the Kit form exists this is a plain mail link (README explains the swap). -->
  <a class="btn" href="mailto:enkokokoko@gmail.com?subject=Tell%20me%20when%20CONVERTIKON%20launches&amp;body=Please%20let%20me%20know%20when%20CONVERTIKON%20is%20out.">Tell me when it launches</a>

  <footer>© 2026 Elizabeth Enko</footer>

</div>
<img class="mascot" src="./assets/mascot.png" alt="" width="448" height="448">
</body>
</html>
